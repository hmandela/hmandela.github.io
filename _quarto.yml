    type: overlay
  navbar:
    pinned: true
    right:
      - text: About
        menu:
          - text: English
            href: about.qmd
          - text: Français
            href: about-fr.qmd
      - text: Blog
        menu:
          - text: All
            href: blog/index.qmd
          - text: English
            href: blog/en.qmd
          - text: Français
            href: blog/fr.qmd
      - text: Publications
        href: publications.qmd
      - text: Talks
        href: talks/index.qmd
      - text: CliMet
        menu:
          - text: All
            href: blog/index.qmd
          - text: English
            href: blog/en.qmd
          - text: Français
            href: blog/fr.qmd
      - icon: github
        href: https://github.com/hmandela
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/mandela-houngnibo/
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Mandela HOUNGNIBO · Made with [Quarto](https://quarto.org/)"
