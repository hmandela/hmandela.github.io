format:
  html:
    theme:
      light: [pulse, custom.scss]
      dark: [darkly, custom-dark.scss]
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?hmandela\.com\/'
    citations-hover: true
    footnotes-hover: true
    toc: true
    code-link: true
    code-copy: true

execute:
  freeze: auto

editor: source
